potential-issues:
  system:
    SystemWarnings:
      - Unattended upgrades are enabled which can lead to uncontrolled changes to
        this environment. If maintenance windows are required please consider disabling
        unattended upgrades.
      - systemd refused 6 start request(s) in total for ceph-osd@0.service on Feb
        10 because the unit start rate limit was hit; a service with Restart= is not
        restarted automatically after this. These units may have been started again
        since. Please check 'systemctl status' and 'journalctl -u' for these units
        and fix the cause; if the limit still blocks a start, 'systemctl reset-failed'
        with the unit name clears it for that unit.
bugs-detected:
  openvswitch:
    https://bugs.launchpad.net/bugs/1978806: This node is using OpenvSwitch and conntrack
      is tracking encapsulated packets (geneve, vxlan etc). This is considered unnecessary
      since it is duplicating tracking for the same packets done by ovs and at scale
      will have a performance impact. See referenced bug for solution and workaround.
