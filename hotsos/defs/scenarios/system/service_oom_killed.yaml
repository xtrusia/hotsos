vars:
  # systemd logs "<unit>: Failed with result 'oom-kill'." (unit_log_failure())
  # when the kernel OOM killer or systemd-oomd killed a process of a service
  # or scope with OOMPolicy=stop or kill (unified cgroup hierarchy, systemd
  # 243 and later). syslog lines start with the legacy timestamp
  # or the RFC3339 one. Group 1 is the date, group 2 the time and group 3
  # the unit. Only the system manager (systemd[1]) is matched.
  expr_oom_kill: '(\w{3,5}\s+\d{1,2}|\d{4}-\d{2}-\d{2})[T ]([\d:]+)\S* \S+ systemd\[1\]: (\S+): Failed with result ''oom-kill''\.'
checks:
  oom_kill:
    input:
      path: 'var/log/syslog'
    search:
      expr: $expr_oom_kill
      hint: 'oom-kill'
      constraints:
        search-result-age-hours: 24
conclusions:
  system-service-oom-killed:
    decision: oom_kill
    raises:
      type: SystemWarning
      message: >-
        systemd reported {numreports} unit failure(s) with result 'oom-kill'
        for {units} on {dates}: the kernel OOM killer or systemd-oomd killed
        processes of these units then. They may have been restarted since.
        Please check the memory limits and usage of these units, the kernel
        OOM reports in kern.log and systemd-oomd messages in the journal.
      format-dict:
        numreports: '@checks.oom_kill.search.num_results'
        units: '@checks.oom_kill.search.results_group_3:unique_comma_join'
        dates: '@checks.oom_kill.search.results_group_1:unique_comma_join'
