checks:
  old_crush_tunables_reported:
    property:
      path: hotsos.core.plugins.storage.ceph.CephCluster.health_checks_unmuted
      ops: [[contains, OLD_CRUSH_TUNABLES]]
conclusions:
  old-crush-tunables:
    decision: old_crush_tunables_reported
    raises:
      type: CephCrushWarning
      message: >-
        Ceph health detail reports OLD_CRUSH_TUNABLES: the CRUSH map
        uses tunables older than mon_crush_min_required_version, which
        may give less optimal data placement. Please check that all
        clients support a newer profile before running 'ceph osd crush
        tunables optimal', as it can trigger significant data movement.
        See
        https://docs.ceph.com/en/latest/rados/operations/crush-map/#tunables
