vars:
  # 'device-mapper: multipath: [<dm>: ]Failing path <major:minor>.' from
  # fail_path() in drivers/md/dm-mpath.c. Newer kernels (v5.15, v6.8)
  # prefix the dm device ("253:3: "), v4.15 does not. kern.log lines start
  # with the legacy syslog timestamp or the RFC3339 one used by rsyslog on
  # Ubuntu 24.04 and later, where the kernel uptime may be absent. Group 1
  # is the date, group 2 the time and group 3 the path (major:minor).
  expr_failing_path: '(\w{3,5}\s+\d{1,2}|\d{4}-\d{2}-\d{2})[T ]([\d:]+)\S* \S+ kernel: (?:\[[^\]]*\] )?device-mapper: multipath: (?:\S+: )?Failing path (\S+)\.'
checks:
  mpath_fail:
    input:
      path: 'var/log/kern.log'
    search:
      expr: $expr_failing_path
      hint: 'Failing path'
      constraints:
        min-results: 1
        search-result-age-hours: 24
conclusions:
  kernel-multipath-failing-path:
    decision: mpath_fail
    raises:
      type: KernelWarning
      message: >-
        device-mapper multipath marked path(s) {paths} as failed
        ({count} 'Failing path' line(s)) on {dates}. I/O to a LUN goes
        on through its remaining paths, and queues or fails if all of them
        have failed. Please check with 'multipath -ll' whether these paths
        are active again, and check the FC/iSCSI links and the switch and
        array health.
      format-dict:
        count: '@checks.mpath_fail.search.num_results'
        paths: '@checks.mpath_fail.search.results_group_3:unique_comma_join'
        dates: '@checks.mpath_fail.search.results_group_1:unique_comma_join'
