checks:
  has_socks_with_drops:
    property: hotsos.core.plugins.kernel.net.NetLink.all_with_drops
conclusions:
  netlink-socks-with-drops:
    decision: has_socks_with_drops
    raises:
      type: NetworkWarning
      message: >-
        This host is reporting dropped packets for the following netlink sockets:

        {socks_with_drops}

        This usually means the processes that own these sockets did not
        read kernel netlink messages fast enough, so they may have missed
        events such as link or route changes. Please check the logs and load
        of the owning processes, which can be found by searching /proc/*/fd
        for socket:[<inode>] when procs is empty.
      format-dict:
        socks_with_drops: hotsos.core.plugins.kernel.net.NetLink.all_with_drops_str
