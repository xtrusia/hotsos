checks:
  qla2xxx_skipping_scsi_scan_host:
    input:
      path: 'var/log/kern.log'
    # NOTE: the kern.log timestamp pattern is of the form
    #       "Jun  8 10:48:13 compute4 kernel:"
    #       or
    #       "Jun 08 10:48:13 compute4 kernel:"
    expr: '.* kernel: qla2xxx (\S+): skipping scsi_scan_host\(\) for non-initiator port'
conclusions:
  qla2xxx_skipped_scsi_scan_host:
    decision: qla2xxx_skipping_scsi_scan_host
    raises:
      type: KernelWarning
      message: >-
        The qla2xxx driver skipped the SCSI scan on host/port {port} because
        the port is not in initiator mode, so disks or paths behind it may
        be missing. If this host should use the port as an initiator, please
        check whether the qla2xxx.qlini_mode module option is set to
        'disabled' (e.g. in /etc/modprobe.d) or the port is used in target
        mode.
      format-dict:
        port: '@checks.qla2xxx_skipping_scsi_scan_host.search.results_group_1:first'
