checks:
  vfs_file_max:
    input:
      path: 'var/log/kern.log'
    expr: '(\w{3,5}\s+\d{1,2}\s+[\d:]+|\d{4}-\d{2}-\d{2}T[\d:]+)\S* \S+ kernel: (?:\[.*\] )?VFS: file-max limit (\d+) reached'
    constraints:
      min-results: 1
      search-result-age-hours: 24
conclusions:
  kernel-vfs-file-max-reached:
    decision: vfs_file_max
    raises:
      type: KernelError
      message: >-
        kern.log contains {count} 'VFS: file-max limit N reached'
        message(s) from the last 24 hours (limit: {limits}), so
        processes without CAP_SYS_ADMIN could not open new files
        (ENFILE). Please compare /proc/sys/fs/file-nr with fs.file-max,
        find the processes holding the most file descriptors and fix
        the leak or raise fs.file-max.
      format-dict:
        count: '@checks.vfs_file_max.search.num_results'
        limits: '@checks.vfs_file_max.search.results_group_2:unique_comma_join'
