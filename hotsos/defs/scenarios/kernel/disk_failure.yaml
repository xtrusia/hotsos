checks:
  disk_failure:
    input:
      path: 'var/log/kern.log'
    # NOTE: the kern.log timestamp pattern is of the form
    #       "Jun  8 10:48:13 compute4 kernel:"
    #       or
    #       "Jun 08 10:48:13 compute4 kernel:"
    expr: '.* kernel: \[.*\] .+ critical medium error, dev ([^,\s]+)'
  any_io_error:
    input:
      path: 'var/log/kern.log'
    # This will match the above 'disk_failure' too. But we want to treat this
    # as a less severe issue.
    expr: '.* kernel: \[.*\].* blk_update_request: (.*?) error, dev ([^,\s]+)'
conclusions:
  failing_disk:
    decision: disk_failure
    raises:
      type: KernelError
      message: >-
        Critical medium errors were logged in kern.log for device(s) {dev},
        which means the disk could not read or write some sectors and is
        likely failing. Please check the disk health (e.g. with smartctl),
        since the disk will likely need to be replaced.
      format-dict:
        dev: '@checks.disk_failure.search.results_group_1:unique_comma_join'
  block_io_error:
    decision:
      - any_io_error
      - not: disk_failure
    raises:
      type: KernelWarning
      message: >-
        Block I/O errors ('{errno}') were logged in kern.log for device(s)
        {dev}. Please check kern.log around these errors and the health of
        the disk and its controller or path to find the cause.
      format-dict:
        errno: '@checks.any_io_error.search.results_group_1:unique_comma_join'
        dev: '@checks.any_io_error.search.results_group_2:unique_comma_join'
