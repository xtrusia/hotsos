raised-issues:
  OpenvSwitchWarning: >-
    ovs-vswitchd logged 3 ovs_rcu warning(s) of 8000 ms or more waiting for
    thread(s) main, pmd-c05/id:12 'to quiesce' on 2022-02-10, so RCU
    synchronization stalled for at least 8 seconds then. Please check the
    host load and 'Unreasonably long ...ms poll interval' warnings from the
    same time, and if it happens again capture per-thread CPU usage of
    ovs-vswitchd with 'top -H' and its thread stacks with gdb or eu-stack.
