target-name: ovs_rcu_quiesce.yaml
data-root:
  files:
    # One long stall and none after it (the log has no recovery line for
    # this). It is still reported with its date.
    var/log/openvswitch/ovs-vswitchd.log: |
      2022-02-10T10:20:10.386Z|00004|ovs_rcu(urcu3)|WARN|blocked 1000 ms waiting for main to quiesce
      2022-02-10T10:20:11.386Z|00005|ovs_rcu(urcu3)|WARN|blocked 2000 ms waiting for main to quiesce
      2022-02-10T10:20:13.386Z|00006|ovs_rcu(urcu3)|WARN|blocked 4000 ms waiting for main to quiesce
      2022-02-10T10:20:17.386Z|00007|ovs_rcu(urcu3)|WARN|blocked 8000 ms waiting for main to quiesce
  copy-from-original:
    - sos_commands/date/date
raised-issues:
  OpenvSwitchWarning: >-
    ovs-vswitchd logged 1 ovs_rcu warning(s) of 8000 ms or more waiting for
    thread(s) main 'to quiesce' on 2022-02-10, so RCU synchronization
    stalled for at least 8 seconds then. Please check the host load and
    'Unreasonably long ...ms poll interval' warnings from the same time,
    and if it happens again capture per-thread CPU usage of ovs-vswitchd
    with 'top -H' and its thread stacks with gdb or eu-stack.
