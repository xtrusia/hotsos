target-name: memory.yaml
mock:
  patch:
    hotsos.core.plugins.kernel.memory.VMStat.compact_success:
      kwargs:
        new: 10001
        create: true
    hotsos.core.plugins.kernel.memory.VMStat.compaction_failures_percent:
      kwargs:
        new: 11
        create: true
  patch.object:
    hotsos.core.plugins.kernel.memory.MemoryChecks:
      kwargs:
        attribute: max_contiguous_unavailable_block_sizes
        new: 1
raised-issues:
  MemoryWarning:
    - >-
      The following NUMA node zones have few free high-order (large
      contiguous) memory blocks: node0-normal. Large allocations may
      fail or stall while the kernel compacts memory. The slab caches
      with the most objects are: buffer_head (87540.6796875k),
      anon_vma_chain (9068.0k), radix_tree_node (50253.65625k),
      Acpi-State (5175.703125k), vmap_area (2700.0k). Please check the
      `memory:nodes` section in the kernel summary or /proc/buddyinfo,
      and the processes and caches using the most memory.
    - >-
      Memory compaction (defragmentation) failures are at 11% of
      successful compactions (compact_fail and compact_success in
      /proc/vmstat), so the kernel often cannot form the large
      contiguous blocks it needs and performance may suffer, especially
      for memory intensive workloads. Please check /proc/vmstat,
      /proc/buddyinfo and the processes using the most memory to find
      what is fragmenting it.
