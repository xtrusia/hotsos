data-root:
  files:
    var/log/kern.log: |
      Aug 25 15:01:20 tatoonie kernel: qla2xxx [0000:04:00.0]-0122:1: skipping scsi_scan_host() for non-initiator port
      Aug 25 15:01:22 tatoonie kernel: qla2xxx [0000:04:00.1]-0122:10: skipping scsi_scan_host() for non-initiator port
  copy-from-original:
    - sos_commands/date/date
raised-issues:
  KernelWarning: >-
    The qla2xxx driver skipped the SCSI scan on host/port
    [0000:04:00.0]-0122:1 because the port is not in initiator mode, so
    disks or paths behind it may be missing. If this host should use the
    port as an initiator, please check whether the qla2xxx.qlini_mode
    module option is set to 'disabled' (e.g. in /etc/modprobe.d) or the
    port is used in target mode.
