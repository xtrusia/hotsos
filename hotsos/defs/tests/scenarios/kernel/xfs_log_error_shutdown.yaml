raised-issues:
  KernelError: >-
    The kernel logged 4 XFS log error shutdown(s) for dm-3, sdb1, sdc1,
    sdd1 on 2022-02-10, Feb  9, Feb 10. I/O to a shut down filesystem fails
    until it is unmounted and mounted again, which may have been done
    since. Please check the XFS and block-layer errors logged before each
    shutdown, fix the cause, and if the filesystem is still shut down,
    unmount and mount it to replay the log.
