target-name: nvme_controller_reset.yaml
data-root:
  files:
    # 6.2+ format: nvme0 recovers from its reset, nvme1 does not.
    var/log/kern.log: |
      Feb 10 10:28:35 host1 kernel: [1694413.621694] nvme nvme0: I/O tag 12 (000c) opcode 0x2 (I/O Cmd) QID 3 timeout, reset controller
      2022-02-10T10:30:35.123456+00:00 host1 kernel: nvme nvme1: controller is down; will reset: CSTS=0xffffffff, PCI_STATUS=0xffff
      2022-02-10T10:31:37.123456+00:00 host1 kernel: nvme nvme1: Disabling device after reset failure: -19
  copy-from-original:
    - sos_commands/date/date
raised-issues:
  KernelError: >-
    NVMe controller(s) nvme1 failed to initialise or to recover from a
    reset in the last 24 hours and were removed or disabled by the kernel
    at that time. Please check whether they are still listed by 'nvme list'
    and please check the drive, slot and firmware for hardware faults.
  KernelWarning: >-
    The nvme driver requested 2 controller reset(s) in the last 24 hours
    for nvme0, nvme1 because a controller was down or a command timed out,
    which stalls I/O to that controller. Please check 'nvme smart-log
    /dev/<controller>', the drive firmware and the surrounding kernel
    messages for I/O errors.
