data-root:
  files:
    var/log/kern.log: |
      2022-02-09T20:15:01.654321+00:00 compute4 kernel: [1700000.000001] neighbour: arp_cache: neighbor table overflow!
      Feb 10 10:48:13 compute4 kernel: [1694413.621694] neighbour: arp_cache: neighbor table overflow!
      2022-02-10T11:02:45.123456+00:00 compute4 kernel: neighbour: ndisc_cache: neighbor table overflow!
  copy-from-original:
    - sos_commands/date/date
raised-issues:
  NetworkWarning: >-
    The kernel logged 3 'neighbor table overflow!' message(s) for
    arp_cache, ndisc_cache on 2022-02-09, 2022-02-10, Feb 10, so new
    neighbour entries could not be created and traffic to some hosts may
    have been dropped. Please check table_fulls and entries of those tables
    in 'ip -s ntable show', which cover all network namespaces, and please
    raise net.ipv4.neigh.default.gc_thresh1/2/3 (arp_cache) or
    net.ipv6.neigh.default.gc_thresh1/2/3 (ndisc_cache) if the workload
    needs more neighbours than gc_thresh3.
