raised-issues:
  NetworkWarning: >-
    The kernel logged 3 'neighbor table overflow!' message(s) for arp_cache,
    ndisc_cache in the last 24 hours, so new neighbour entries were not created
    and traffic to some hosts may have been dropped. Please check table_fulls
    in 'ip -s ntable show' and please raise the
    net.ipv4/ipv6.neigh.default.gc_thresh* sysctls if needed.
