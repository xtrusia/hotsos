raised-issues:
  NetworkWarning: >-
    kern.log has 'Detected Tx Unit Hang' or 'Detected Hardware Unit Hang'
    errors from the e1000e, igb, ixgbe driver(s) for the network adapter(s)
    at PCI address(es) 0000:00:1f.6, 0000:01:00.0, 0000:01:00.1 on
    2022-02-10, Feb  9, Feb 10. The driver logs this when a transmit queue
    has stopped sending packets; ixgbe then resets the adapter, and igb and
    e1000e reset it after the transmit timeout that usually follows ('Reset
    adapter'), so traffic on that interface stops until the reset completes
    and repeated hangs can leave it without network. Please check how often
    this happens and whether the link recovers after each reset, whether it
    started after a kernel, driver or NIC firmware change (ethtool -i), and
    the NIC firmware, offload settings (ethtool -k) and switch port for
    those adapters.
