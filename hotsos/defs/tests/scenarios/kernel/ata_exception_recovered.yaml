target-name: ata_exception.yaml
data-root:
  files:
    # A command timeout followed by a successful reset and later normal
    # operation. The exception is still reported with its date.
    var/log/kern.log: |
      Feb 10 10:48:13 compute4 kernel: [1694413.621694] ata1.00: exception Emask 0x0 SAct 0x0 SErr 0x0 action 0x6 frozen
      Feb 10 10:48:13 compute4 kernel: [1694413.621700] ata1.00: failed command: READ DMA EXT
      Feb 10 10:48:14 compute4 kernel: [1694414.621694] ata1: hard resetting link
      Feb 10 10:48:15 compute4 kernel: [1694415.121694] ata1: SATA link up 6.0 Gbps (SStatus 133 SControl 300)
      Feb 10 10:48:15 compute4 kernel: [1694415.131694] ata1.00: configured for UDMA/133
      Feb 10 10:48:15 compute4 kernel: [1694415.131700] ata1: EH complete
  copy-from-original:
    - sos_commands/date/date
raised-issues:
  KernelWarning: >-
    The kernel logged 1 libata exception(s) for ata1.00 on Feb 10
    (exceptions with the PHYRdyChg or DevExch SError bit set, usually
    hotplug, are not counted). libata ran error handling for these ports or
    devices, for example after a command timeout, a device error or an
    interface error, and may have recovered since. Please check the failed
    command and error lines that follow each exception, find the disk on
    each port ('ls -l /sys/block' shows the ataN port in each disk's path),
    run 'smartctl -a' on it and check its cable and controller.
