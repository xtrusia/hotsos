target-name: clocksource_unstable.yaml
data-root:
  files:
    # Ubuntu 24.04 (6.8) KVM guest: tsc was not the current clocksource, so
    # there is no switch.
    var/log/kern.log: |
      2022-02-10T11:02:44.123456+00:00 juju-guest-7 kernel: clocksource: timekeeping watchdog on CPU0: Marking clocksource 'tsc' as unstable because the skew is too large:
      2022-02-10T11:02:44.123458+00:00 juju-guest-7 kernel: clocksource:                       'kvm-clock' wd_nsec: 512000420 wd_now: 1a2b3c4d5e wd_last: 1a0b2c3d4e mask: ffffffffffffffff
      2022-02-10T11:02:44.123459+00:00 juju-guest-7 kernel: clocksource:                       'tsc' cs_nsec: 1012000420 cs_now: 3a1b2c3d4e5f cs_last: 3a1a2b3c4d5e mask: ffffffffffffffff
      2022-02-10T11:02:44.123460+00:00 juju-guest-7 kernel: clocksource:                       Clocksource 'tsc' skewed 500000000 ns (500 ms) over watchdog 'kvm-clock' interval of 512000420 ns (512 ms)
      2022-02-10T11:02:44.123461+00:00 juju-guest-7 kernel: clocksource:                       'kvm-clock' (not 'tsc') is current clocksource.
      2022-02-10T11:02:44.123462+00:00 juju-guest-7 kernel: tsc: Marking TSC unstable due to clocksource watchdog
  copy-from-original:
    - sos_commands/date/date
raised-issues:
  KernelWarning: >-
    The kernel clocksource watchdog marked clocksource(s) tsc as unstable
    on 2022-02-10 because their skew against the watchdog clocksource was
    too large. The kernel demotes an unstable clocksource and normally
    does not use it again until the next reboot, unless an override (the
    clocksource= boot option or a write to current_clocksource) forces it.
    If it was the current clocksource, the kernel usually switched to
    another one, which for tsc usually means a slower clocksource and more
    overhead for every time read. On virtual machines and busy hosts the
    skew can also come from delays in the watchdog itself rather than from
    a broken clock. Please check the current clocksource in
    /sys/devices/system/clocksource/clocksource0/current_clocksource, the
    watchdog and clocksource values in the kern.log lines that follow the
    'Marking clocksource' line, and the host or hypervisor load and
    firmware settings.
