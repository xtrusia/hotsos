raised-issues:
  KernelError: >-
    6 reports of NETDEV WATCHDOG transmit queue timeouts for enp1s0f0
    (i40e), ens3 (virtio_net), eth2 (ixgbe), eth3 (ixgbe), eth5, eth6 in
    the kernel log on Feb 10, 2022-02-10. Please check the driver and
    firmware of those interfaces ('ethtool -i <interface>') and make sure
    they are at the latest version and, on virtual machines, check the
    hypervisor host.
