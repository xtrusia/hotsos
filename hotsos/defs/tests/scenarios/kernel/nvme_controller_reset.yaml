data-root:
  files:
    # The abort line is not a reset request and is not counted.
    var/log/kern.log: |
      Feb 10 10:28:35 host1 kernel: [1694413.621694] nvme nvme0: controller is down; will reset: CSTS=0xffffffff, PCI_STATUS=0xffff
      Feb 10 10:29:35 host1 kernel: [1694473.621694] nvme nvme0: I/O tag 12 (000c) opcode 0x2 (I/O Cmd) QID 3 timeout, reset controller
      2022-02-10T10:30:35.123456+00:00 host1 kernel: nvme nvme1: I/O 7 QID 0 timeout, reset controller
      Feb 10 10:31:35 host1 kernel: [1694533.600000] nvme nvme0: I/O tag 12 (000c) opcode 0x2 (I/O Cmd) QID 3 timeout, aborting req_op:READ(0) size:4096
  copy-from-original:
    - sos_commands/date/date
raised-issues:
  KernelWarning: >-
    The nvme driver logged 3 controller reset request(s) for nvme0, nvme1
    on 2022-02-10, Feb 10 because a controller was down or a command timed
    out, which stalls I/O to that controller. Please check 'nvme smart-log
    /dev/<controller>', the drive firmware and the surrounding kernel
    messages for I/O errors.
