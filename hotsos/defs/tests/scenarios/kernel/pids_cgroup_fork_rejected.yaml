data-root:
  files:
    var/log/kern.log: |
      Feb 10 10:48:13 compute4 kernel: [1694413.621694] cgroup: fork rejected by pids controller in /system.slice/containerd.service
      Feb 10 10:48:14 compute4 kernel: [1694414.621694] cgroup: cgroup2: unknown option "nsdelegate2"
      2022-02-10T11:02:44.123456+00:00 compute4 kernel: cgroup: fork rejected by pids controller in /system.slice/docker.service
      2022-02-10T11:05:01.123456+00:00 compute4 kernel: cgroup: fork rejected by pids controller in /batch jobs/worker
  copy-from-original:
    - sos_commands/date/date
raised-issues:
  KernelWarning: >-
    The pids controller rejected forks in /batch jobs/worker,
    /system.slice/containerd.service, /system.slice/docker.service in the last
    24 hours because pids.max of the cgroup or a parent was reached, so
    fork/clone failed with EAGAIN. Please compare pids.current with pids.max of
    these cgroups and their parents and please raise TasksMax or the container
    pids limit if needed.
