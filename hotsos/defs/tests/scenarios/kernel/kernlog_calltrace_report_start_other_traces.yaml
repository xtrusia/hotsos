raised-issues:
  KernelError:
    - >-
      11 reports of soft lockups ('BUG: soft lockup - CPU#N stuck') in the
      kernel log on 2022-02-10. Please check the call trace that follows each
      report and, on virtual machines, check the hypervisor host for CPU
      contention.
    - >-
      11 call traces in the kernel log on 2022-02-10 were not attributed
      to a soft lockup, RCU stall, bad page state, page allocation
      failure or NETDEV WATCHDOG report, or to an OOM kill, hung task,
      bcache or fanotify deadlock that hotsos counted. Please check the
      WARNING, BUG, oops, panic, 'invoked oom-killer' or 'blocked for
      more than' line before each call trace to identify the cause.
