    handling for these ports or devices, for example after a command
    timeout, a device error or an interface error, and may have recovered
    since. Please check the failed command and error lines that follow each
    exception, find the disk on each port ('ls -l /sys/block' shows the
    ataN port in each disk's path), run 'smartctl -a' on it and check its
    cable and controller.
