raised-issues:
  KernelError: >-
    kern.log has ext4 'Delayed block allocation failed for inode ... with
    error N' messages for dm-3, sdb1, sdc1 (errors: 117, 28, 5) on
    2022-02-10, Feb  9, Feb 10. ext4 logs this, followed by 'This should
    not happen!! Data will be lost', when it cannot allocate blocks during
    writeback for data that applications had already written to the page
    cache, and it then discards that data, so files on that filesystem can
    be missing data even though the writes succeeded. Error 28 (ENOSPC)
    means the filesystem had no free blocks left (ext4 retries ENOSPC
    while free clusters remain); other errors such as 5 (EIO) or 117
    (EFSCORRUPTED) point at an I/O error or filesystem corruption. Please
    check free space on the filesystem (df -h), I/O or EXT4-fs errors
    around the same time, and the files that applications wrote then.
