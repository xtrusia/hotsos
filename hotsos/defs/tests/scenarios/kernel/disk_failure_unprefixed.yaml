target-name: disk_failure.yaml
data-root:
  files:
    var/log/kern.log: |
      Nov 19 12:00:01 node kernel: [ 2000.100000] critical medium error, dev sda, sector 10 op 0x0:(READ) flags 0x0 phys_seg 1 prio class 0
  copy-from-original:
    - sos_commands/date/date
raised-issues:
  KernelError: >-
    critical medium error detected in kern.log for device sda. This implies
    that this disk has a hardware issue!
