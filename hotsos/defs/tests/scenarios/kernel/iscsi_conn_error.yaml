data-root:
  files:
    var/log/kern.log: |
      Feb 10 10:48:13 compute4 kernel: [1694413.621694]  connection1:0: detected conn error (1020)
      Feb 10 10:48:14 compute4 kernel: [  725.797102]  connection1:0: detected conn error (1022)
      2022-02-10T11:02:51.123456+00:00 compute4 kernel:  connection2:0: detected conn error (1020)
  copy-from-original:
    - sos_commands/date/date
raised-issues:
  KernelWarning: >-
    The kernel logged 3 iSCSI 'detected conn error' line(s) for
    connection1:0, connection2:0 (error codes: 1020, 1022) on 2022-02-10,
    Feb 10, so connections to the target failed then and I/O may have
    failed if a session did not recover. The codes are defined in enum
    iscsi_err in the kernel header include/scsi/iscsi_if.h. Please check
    'iscsiadm -m session -P3', the multipath state, network connectivity to
    the portal and the target health.
