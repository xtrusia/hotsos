raised-issues:
  KernelError:
    - >-
      1 reports of RCU CPU stall warnings ('detected stalls on CPUs/tasks' or
      'self-detected stall on CPU') in the kernel log on Feb 9. Please check
      the stall details and call traces (if any) that follow each warning
      and, on virtual machines, check the hypervisor host for CPU
      contention.
    - >-
      1 reports of soft lockups ('BUG: soft lockup - CPU#N stuck') in the
      kernel log on Feb 10. Please check the call trace that follows each
      report and, on virtual machines, check the hypervisor host for CPU
      contention.
    - >-
      1 reports of NETDEV WATCHDOG transmit queue timeouts for eth2 (ixgbe)
      in the kernel log on Feb 9. Please check the driver and firmware of
      those interfaces ('ethtool -i <interface>') and make sure they are at
      the latest version and, on virtual machines, check the hypervisor host.
    - >-
      2 call traces in the kernel log on Feb 9, Feb 10 were not
      attributed to a soft lockup, RCU stall, bad page state, page
      allocation failure or NETDEV WATCHDOG report, or to an OOM kill,
      hung task, bcache or fanotify deadlock that hotsos counted. Please
      check the WARNING, BUG, oops, panic, 'invoked oom-killer' or
      'blocked for more than' line before each call trace to identify the
      cause.
