data-root:
  files:
    # Legacy lines followed by newer RFC3339 lines (e.g. after an upgrade to
    # 24.04), with a corrected error only (UC bit clear in the status).
    var/log/kern.log: |
      Feb  9 18:00:01 compute4 kernel: [1694413.621690] mce: [Hardware Error]: CPU 3: Machine Check: 0 Bank 7: 8c00004000010090
      Feb  9 18:00:01 compute4 kernel: [1694413.621691] mce: [Hardware Error]: TSC 0 ADDR 1c3f8f080 MISC 9001
      Feb  9 18:00:01 compute4 kernel: [1694413.621692] mce: [Hardware Error]: PROCESSOR 0:50654 TIME 1644429601 SOCKET 0 APIC 6 microcode 2006b06
      Feb  9 18:00:01 compute4 kernel: [1694413.621694] mce: [Hardware Error]: Machine check events logged
      2022-02-10T10:48:13.621694+00:00 compute4 kernel: mce: [Hardware Error]: Machine check events logged
  copy-from-original:
    - sos_commands/date/date
raised-issues:
  KernelWarning: >-
    The kernel logged x86 machine check (MCE) records on 2022-02-10,
    Feb  9. The kernel also logs these for errors the hardware corrected,
    so they do not necessarily mean that data was lost, but an EDAC driver
    may have decoded the same records as uncorrected errors. Please check
    the EDAC lines in kern.log and, if rasdaemon was running, the errors
    it recorded ('ras-mc-ctl --errors'), decode the CPU lines with 'mcelog
    --ascii' on Intel, check the BMC/IPMI event log and contact the
    hardware vendor if the errors are uncorrected or keep recurring.
