target-name: mce_hardware_error.yaml
data-root:
  files:
    # RFC3339 only (rsyslog default since 24.04). The first line is older
    # than 24h and must not be counted.
    var/log/kern.log: |
      2022-02-01T10:48:13.621694+00:00 compute4 kernel: mce: [Hardware Error]: Machine check events logged
      2022-02-10T08:00:01.621690+00:00 compute4 kernel: mce: [Hardware Error]: CPU 3: Machine Check: 0 Bank 7: 8c00004000010090
      2022-02-10T08:00:01.621691+00:00 compute4 kernel: mce: [Hardware Error]: TSC 0 ADDR 1c3f8f080 MISC 9001
      2022-02-10T10:48:13.621694+00:00 compute4 kernel: mce: [Hardware Error]: Machine check events logged
  copy-from-original:
    - sos_commands/date/date
raised-issues:
  KernelError: >-
    kern.log contains 2 x86 machine check (MCE) line(s) from the last 24
    hours, meaning the CPU or platform reported a corrected or uncorrected
    hardware error. Please decode the events with mcelog or rasdaemon,
    check the BMC/IPMI event log and contact the hardware vendor if errors
    are uncorrected or recurring.
