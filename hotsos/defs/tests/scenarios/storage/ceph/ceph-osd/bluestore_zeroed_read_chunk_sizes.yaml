raised-issues:
  CephOSDWarning: >-
    BlueStore on this host (OSD id(s) 2) logged 3 checksum
    error(s) on 2022-02-09 where the checksum computed from the data read
    back is that of an all-zero block, so the read most likely returned
    zeroes instead of the stored data, for example from a failing disk or controller, a
    lost volatile write cache or the kernel I/O path. Please check the
    kernel log and SMART data of the disks behind those OSDs
    (https://tracker.ceph.com/issues/22464).
