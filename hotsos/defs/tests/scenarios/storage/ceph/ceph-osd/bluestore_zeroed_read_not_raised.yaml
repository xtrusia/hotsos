      2022-02-09T18:19:02.001+0000 7faf9d3bb700 -1 bluestore(/var/lib/ceph/osd/ceph-1) _verify_csum bad crc32c/0x10000 checksum at blob offset 0x0, got 0x6706be76, expected 0xc939ea08, device location [0x41822f0000~10000], logical extent 0x200000~10000, object #2:4a3b1c2d:::rbd_data.1f2e3d4c5b6a.0000000000000a1b:head#
  copy-from-original:
    - sos_commands/date/date
    - sos_commands/systemd/systemctl_list-units
