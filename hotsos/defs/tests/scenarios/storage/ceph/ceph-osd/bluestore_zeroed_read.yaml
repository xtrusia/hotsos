data-root:
  files:
    # Zero-block checksum errors on two OSDs, each in its own log file.
    var/log/ceph/ceph-osd.1.log: |
      2022-02-09T18:18:32.791+0000 7faf9d3bb700 -1 bluestore(/var/lib/ceph/osd/ceph-1) _verify_csum bad crc32c/0x1000 checksum at blob offset 0x0, got 0x6706be76, expected 0xc939ea08, device location [0x41822f0000~1000], logical extent 0x200000~1000, object #2:4a3b1c2d:::rbd_data.1f2e3d4c5b6a.0000000000000a1b:head#
      2022-02-09T18:18:32.795+0000 7faf9d3bb700 -1 bluestore(/var/lib/ceph/osd/ceph-1) _verify_csum bad crc32c/0x1000 checksum at blob offset 0x0, got 0x6706be76, expected 0xc939ea08, device location [0x41822f0000~1000], logical extent 0x200000~1000, object #2:4a3b1c2d:::rbd_data.1f2e3d4c5b6a.0000000000000a1b:head#
    var/log/ceph/ceph-osd.3.log: |
      2022-02-10T09:02:11.104+0000 7faf9d3bb700 -1 bluestore(/var/lib/ceph/osd/ceph-3) _verify_csum bad crc32c/0x1000 checksum at blob offset 0x0, got 0x6706be76, expected 0xc939ea08, device location [0x41822f0000~1000], logical extent 0x200000~1000, object #2:4a3b1c2d:::rbd_data.1f2e3d4c5b6a.0000000000000a1b:head#
  copy-from-original:
    - sos_commands/date/date
    - sos_commands/systemd/systemctl_list-units
    - sos_commands/systemd/systemctl_list-unit-files
raised-issues:
  CephOSDWarning: >-
    ceph-osd logged 3 BlueStore checksum error(s) ('_verify_csum bad
    crc32c/0x1000 ... got 0x6706be76') for OSD id(s) 1, 3 on 2022-02-09,
    2022-02-10. 0x6706be76 is the checksum of a 4 KiB block of zeros, so
    those reads returned zeros instead of the stored data, which usually
    comes from the disk, its controller or the kernel I/O path rather than
    from BlueStore. BlueStore retries such reads
    (bluestore_retry_disk_reads, 3 by default) and returns an I/O error if
    every retry fails. Please check the kernel log and SMART data of the
    disks behind those OSDs and look for BLUESTORE_SPURIOUS_READ_ERRORS in
    'ceph health detail', and please see
    https://docs.ceph.com/en/latest/rados/operations/health-checks/#bluestore-spurious-read-errors
    for the possible causes.
