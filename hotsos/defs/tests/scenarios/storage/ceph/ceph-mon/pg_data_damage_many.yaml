  copy-from-original:
    - sos_commands/date/date
    - sos_commands/systemd/systemctl_list-units
    - sos_commands/systemd/systemctl_list-unit-files
raised-issues:
  CephOSDError: >-
    Ceph health detail reports Possible data damage: 1 pg recovery_unfound,
    6 pgs inconsistent (pg 4.0 is active+clean+inconsistent, acting
    [0,1,2]; pg 4.1 is active+clean+inconsistent, acting [1,2,0]; pg 4.2 is
    active+clean+inconsistent, acting [2,0,1]; pg 4.3 is
    active+clean+inconsistent, acting [0,1,2]; pg 4.4 is
    active+clean+inconsistent, acting [1,2,0]; and 2 more listed). In an
    inconsistent PG, scrub found object copies that differ or could not be
    read. Please run 'rados list-inconsistent-obj <pgid>
    --format=json-pretty' for each inconsistent PG to see which OSD copies
    have errors, check the disks of OSDs whose copies have a read_error
    (dmesg, smartctl), and only then run 'ceph pg repair <pgid>', which
    overwrites the copies Ceph considers bad and can pick the wrong one
    when a data digest is missing
    (https://docs.ceph.com/en/latest/rados/troubleshooting/troubleshooting-pg/#pgs-inconsistent).
    For a snaptrim_error PG, please look for 'Can not trim' and other
    snapshot errors from its primary OSD in the cluster log (ceph.log). For
    a PG with unfound objects, please follow
    https://docs.ceph.com/en/latest/rados/operations/health-checks/#object-unfound.
