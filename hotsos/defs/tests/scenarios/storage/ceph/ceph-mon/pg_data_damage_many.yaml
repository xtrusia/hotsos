    # are listed.
    sos_commands/ceph_mon/json_output/ceph_status_--format_json-pretty: |
      {
          "fsid": "eccf3d48-859f-11ec-9de2-d72b3e8a3058",
          "health": {
              "status": "HEALTH_ERR"
          }
      }
    sos_commands/ceph_mon/json_output/ceph_health_detail_--format_json-pretty: |
      {
          "status": "HEALTH_ERR",
          "checks": {
              "OSD_SCRUB_ERRORS": {
                  "severity": "HEALTH_ERR",
                  "summary": {
                      "message": "7 scrub errors",
                      "count": 7
                  },
                  "detail": [],
                  "muted": false
              },
              "PG_DAMAGED": {
                  "severity": "HEALTH_ERR",
                  "summary": {
                      "message": "Possible data damage: 1 pg recovery_unfound, 6 pgs inconsistent",
                      "count": 7
                  },
                  "detail": [
                      {
                          "message": "pg 4.0 is active+clean+inconsistent, acting [0,1,2]"
                      },
                      {
                          "message": "pg 4.1 is active+clean+inconsistent, acting [1,2,0]"
                      },
                      {
                          "message": "pg 4.2 is active+clean+inconsistent, acting [2,0,1]"
                      },
                      {
                          "message": "pg 4.3 is active+clean+inconsistent, acting [0,1,2]"
                      },
                      {
                          "message": "pg 4.4 is active+clean+inconsistent, acting [1,2,0]"
                      },
                      {
                          "message": "pg 4.5 is active+clean+inconsistent, acting [2,0,1]"
                      },
