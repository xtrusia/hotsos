data-root:
  files:
    sos_commands/ceph_mon/json_output/ceph_status_--format_json-pretty: |
      {
          "fsid": "eccf3d48-859f-11ec-9de2-d72b3e8a3058",
          "health": {
              "status": "HEALTH_WARN"
          }
      }
    sos_commands/ceph_mon/json_output/ceph_health_detail_--format_json-pretty: |
      {
          "status": "HEALTH_WARN",
          "checks": {
              "OSD_TOO_MANY_REPAIRS": {
                  "severity": "HEALTH_WARN",
                  "summary": {
                      "message": "Too many repaired reads on 1 OSDs"
                  },
                  "muted": false
              }
          },
          "mutes": []
      }
  copy-from-original:
    - sos_commands/date/date
    - sos_commands/systemd/systemctl_list-units
    - sos_commands/systemd/systemctl_list-unit-files
raised-issues:
  CephOSDWarning: >-
    Ceph health detail reports OSD_TOO_MANY_REPAIRS: OSDs have repeatedly
    had to repair reads from replicas, which usually indicates failing
    storage media. Please check the health of the disks backing the
    affected OSDs and replace them if needed. See
    https://docs.ceph.com/en/latest/rados/operations/health-checks/#osd-too-many-repairs
