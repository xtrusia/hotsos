raised-bugs:
  https://tracker.ceph.com/issues/53062: >-
    Ceph health detail reports one or more of BLUESTORE_LEGACY_STATFS,
    BLUESTORE_NO_PER_POOL_OMAP and BLUESTORE_NO_PER_PG_OMAP and 'ceph
    versions' shows OSDs running 16.2.5. On Pacific before 16.2.7, converting
    those OSDs with 'ceph-bluestore-tool repair' or quick-fix, or with
    bluestore_fsck_quick_fix_on_mount set to true, can corrupt their OMAP
    data. Please keep bluestore_fsck_quick_fix_on_mount set to false and
    please upgrade the OSDs to the latest version before converting them.
