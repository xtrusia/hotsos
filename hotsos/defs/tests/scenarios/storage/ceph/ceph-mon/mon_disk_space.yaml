data-root:
  files:
    sos_commands/ceph_mon/json_output/ceph_status_--format_json-pretty: |
      {
          "fsid": "eccf3d48-859f-11ec-9de2-d72b3e8a3058",
          "health": {
              "status": "HEALTH_ERR"
          }
      }
    sos_commands/ceph_mon/json_output/ceph_health_detail_--format_json-pretty: |
      {
          "status": "HEALTH_ERR",
          "checks": {
              "MON_DISK_LOW": {
                  "severity": "HEALTH_WARN",
                  "summary": {
                      "message": "mon juju-a79b06-10-lxd-0 is low on available space"
                  },
                  "muted": false
              },
              "MON_DISK_CRIT": {
                  "severity": "HEALTH_ERR",
                  "summary": {
                      "message": "mons juju-a79b06-10-lxd-0,juju-a79b06-11-lxd-0 are very low on available space"
                  },
                  "muted": false
              }
          },
          "mutes": []
      }
  copy-from-original:
    - sos_commands/date/date
    - sos_commands/systemd/systemctl_list-units
    - sos_commands/systemd/systemctl_list-unit-files
raised-issues:
  CephMonWarning: >-
    Ceph health detail reports MON_DISK_LOW or MON_DISK_CRIT: the
    filesystem hosting a monitor data store (/var/lib/ceph/mon) is low on
    space, and a monitor that runs out of space will stop. Please free up
    space or extend the filesystem on the affected monitor hosts. See
    https://docs.ceph.com/en/latest/rados/operations/health-checks/#mon-disk-low
