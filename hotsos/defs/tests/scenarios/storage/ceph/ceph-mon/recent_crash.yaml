data-root:
  files:
    sos_commands/ceph_mon/json_output/ceph_status_--format_json-pretty: |
      {
          "fsid": "eccf3d48-859f-11ec-9de2-d72b3e8a3058",
          "health": {
              "status": "HEALTH_WARN"
          }
      }
    sos_commands/ceph_mon/json_output/ceph_health_detail_--format_json-pretty: |
      {
          "status": "HEALTH_WARN",
          "checks": {
              "RECENT_CRASH": {
                  "severity": "HEALTH_WARN",
                  "summary": {
                      "message": "2 daemons have recently crashed"
                  },
                  "muted": false
              }
          },
          "mutes": []
      }
  copy-from-original:
    - sos_commands/date/date
    - sos_commands/systemd/systemctl_list-units
    - sos_commands/systemd/systemctl_list-unit-files
raised-issues:
  CephDaemonWarning: >-
    Ceph health detail reports RECENT_CRASH or RECENT_MGR_MODULE_CRASH: one
    or more Ceph daemons or mgr modules have crashed recently. Please
    inspect the reports with 'ceph crash ls' and 'ceph crash info <id>',
    then archive them with 'ceph crash archive-all'. See
    https://docs.ceph.com/en/latest/rados/operations/health-checks/#recent-crash
