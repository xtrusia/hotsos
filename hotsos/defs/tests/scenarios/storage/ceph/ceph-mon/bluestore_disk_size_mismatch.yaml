data-root:
  files:
    sos_commands/ceph_mon/json_output/ceph_status_--format_json-pretty: |
      {
          "fsid": "eccf3d48-859f-11ec-9de2-d72b3e8a3058",
          "health": {
              "status": "HEALTH_WARN"
          }
      }
    sos_commands/ceph_mon/json_output/ceph_health_detail_--format_json-pretty: |
      {
          "status": "HEALTH_WARN",
          "checks": {
              "BLUESTORE_DISK_SIZE_MISMATCH": {
                  "severity": "HEALTH_WARN",
                  "summary": {
                      "message": "1 OSD(s) have dangerous mismatch between BlueStore block device and free list sizes"
                  },
                  "muted": false
              }
          },
          "mutes": []
      }
  copy-from-original:
    - sos_commands/date/date
    - sos_commands/systemd/systemctl_list-units
    - sos_commands/systemd/systemctl_list-unit-files
raised-issues:
  CephOSDWarning: >-
    Ceph health detail reports BLUESTORE_DISK_SIZE_MISMATCH: the block
    device size of one or more OSDs disagrees with the BlueStore free list
    size, which can lead to data corruption. Please identify the OSDs with
    'ceph health detail' and redeploy them one at a time. See
    https://docs.ceph.com/en/latest/rados/operations/health-checks/#bluestore-disk-size-mismatch
