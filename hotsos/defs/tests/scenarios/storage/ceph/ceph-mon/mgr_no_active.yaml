data-root:
  files:
    sos_commands/ceph_mon/json_output/ceph_status_--format_json-pretty: |
      {
          "fsid": "eccf3d48-859f-11ec-9de2-d72b3e8a3058",
          "health": {
              "status": "HEALTH_WARN"
          }
      }
    sos_commands/ceph_mon/json_output/ceph_health_detail_--format_json-pretty: |
      {
          "status": "HEALTH_WARN",
          "checks": {
              "MGR_DOWN": {
                  "severity": "HEALTH_WARN",
                  "summary": {
                      "message": "no active mgr"
                  },
                  "muted": false
              }
          },
          "mutes": []
      }
  copy-from-original:
    - sos_commands/date/date
    - sos_commands/systemd/systemctl_list-units
    - sos_commands/systemd/systemctl_list-unit-files
raised-issues:
  CephWarning: >-
    Ceph health detail reports MGR_DOWN: there is no active ceph-mgr
    daemon, so stats reporting, the dashboard and other mgr modules are not
    working. Please check that ceph-mgr is running on at least one host and
    review its log. See
    https://docs.ceph.com/en/latest/rados/operations/health-checks/#mgr-down
