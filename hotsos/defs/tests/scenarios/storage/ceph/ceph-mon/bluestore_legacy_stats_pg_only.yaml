target-name: bluestore_legacy_stats.yaml
data-root:
  files:
    # Only BLUESTORE_NO_PER_PG_OMAP (bluestore_warn_on_no_per_pg_omap enabled)
    # on 16.2.4 OSDs, inside the range of the Ceph upgrade note.
    sos_commands/ceph_mon/json_output/ceph_status_--format_json-pretty: |
      {
          "fsid": "eccf3d48-859f-11ec-9de2-d72b3e8a3058",
          "health": {
              "status": "HEALTH_WARN"
          }
      }
    sos_commands/ceph_mon/json_output/ceph_health_detail_--format_json-pretty: |
      {
          "status": "HEALTH_WARN",
          "checks": {
              "BLUESTORE_NO_PER_PG_OMAP": {
                  "severity": "HEALTH_WARN",
                  "summary": {
                      "message": "1 OSD(s) reporting legacy (not per-pg) BlueStore omap",
                      "count": 1
                  },
                  "detail": [
                      {
                          "message": " osd.1 legacy (not per-pg) omap detected, suggest to run store repair to benefit from faster PG removal"
                      }
                  ],
                  "muted": false
              }
          },
          "mutes": []
      }
    sos_commands/ceph_mon/ceph_versions: |
      {
          "mon": {
              "ceph version 16.2.4 (0a1b2c3d4e5f60718293a4b5c6d7e8f901234567) pacific (stable)": 3
          },
          "mgr": {
              "ceph version 16.2.4 (0a1b2c3d4e5f60718293a4b5c6d7e8f901234567) pacific (stable)": 3
          },
          "osd": {
              "ceph version 16.2.4 (0a1b2c3d4e5f60718293a4b5c6d7e8f901234567) pacific (stable)": 3
          },
          "mds": {},
          "overall": {}
      }
  copy-from-original:
    - sos_commands/date/date
    - sos_commands/systemd/systemctl_list-units
    - sos_commands/systemd/systemctl_list-unit-files
raised-bugs:
  https://tracker.ceph.com/issues/53062: >-
    Ceph health detail reports BLUESTORE_NO_PER_PG_OMAP for osd.1 (a legacy
    BlueStore stats or omap format, for which Ceph suggests a store repair)
    and 'ceph versions' shows running OSD version(s) 16.2.4. Ceph warns
    that on Pacific 16.2.6 and earlier the omap format conversion done by
    'ceph-bluestore-tool repair' or 'quick-fix', or by an OSD started with
    bluestore_fsck_quick_fix_on_mount = true, can corrupt omap data. 'ceph
    versions' does not say which OSDs run which version, and OSDs created
    on Octopus may not be listed above. Please do not run repair or
    quick-fix on any OSD that runs one of those versions, keep
    bluestore_fsck_quick_fix_on_mount false until all OSDs run 16.2.7 or
    later, and then convert the OSDs as described in
    https://docs.ceph.com/en/latest/rados/operations/health-checks/#bluestore-no-per-pg-omap.
