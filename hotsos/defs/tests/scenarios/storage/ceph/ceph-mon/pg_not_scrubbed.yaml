data-root:
  files:
    sos_commands/ceph_mon/json_output/ceph_status_--format_json-pretty: |
      {
          "fsid": "eccf3d48-859f-11ec-9de2-d72b3e8a3058",
          "health": {
              "status": "HEALTH_WARN"
          }
      }
    sos_commands/ceph_mon/json_output/ceph_health_detail_--format_json-pretty: |
      {
          "status": "HEALTH_WARN",
          "checks": {
              "PG_NOT_SCRUBBED": {
                  "severity": "HEALTH_WARN",
                  "summary": {
                      "message": "12 pgs not scrubbed in time"
                  },
                  "muted": false
              },
              "PG_NOT_DEEP_SCRUBBED": {
                  "severity": "HEALTH_WARN",
                  "summary": {
                      "message": "3 pgs not deep-scrubbed in time"
                  },
                  "muted": false
              }
          },
          "mutes": []
      }
  copy-from-original:
    - sos_commands/date/date
    - sos_commands/systemd/systemctl_list-units
    - sos_commands/systemd/systemctl_list-unit-files
raised-issues:
  CephOSDWarning: >-
    Ceph health detail reports PG_NOT_SCRUBBED or PG_NOT_DEEP_SCRUBBED:
    some placement groups have not been scrubbed within the configured
    interval, so data corruption may go undetected. Please check that the
    noscrub/nodeep-scrub flags are not set and that scrubbing is not
    starved by recovery or client load. See
    https://docs.ceph.com/en/latest/rados/operations/health-checks/#pg-not-scrubbed
