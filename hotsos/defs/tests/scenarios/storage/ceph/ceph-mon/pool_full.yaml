data-root:
  files:
    sos_commands/ceph_mon/json_output/ceph_status_--format_json-pretty: |
      {
          "fsid": "eccf3d48-859f-11ec-9de2-d72b3e8a3058",
          "health": {
              "status": "HEALTH_ERR"
          }
      }
    sos_commands/ceph_mon/json_output/ceph_health_detail_--format_json-pretty: |
      {
          "status": "HEALTH_ERR",
          "checks": {
              "POOL_FULL": {
                  "severity": "HEALTH_ERR",
                  "summary": {
                      "message": "1 pools full"
                  },
                  "muted": false
              }
          },
          "mutes": []
      }
  copy-from-original:
    - sos_commands/date/date
    - sos_commands/systemd/systemctl_list-units
    - sos_commands/systemd/systemctl_list-unit-files
raised-issues:
  CephWarning: >-
    Ceph health detail reports POOL_FULL: one or more pools have reached or
    are approaching their quota, or are flagged full because their OSDs are
    out of space. Please check 'ceph df' and raise the pool quota or add
    capacity as appropriate. See
    https://docs.ceph.com/en/latest/rados/operations/health-checks/#pool-full
