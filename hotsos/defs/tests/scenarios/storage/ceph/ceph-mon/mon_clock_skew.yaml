data-root:
  files:
    sos_commands/ceph_mon/json_output/ceph_status_--format_json-pretty: |
      {
          "fsid": "eccf3d48-859f-11ec-9de2-d72b3e8a3058",
          "health": {
              "status": "HEALTH_WARN"
          }
      }
    sos_commands/ceph_mon/json_output/ceph_health_detail_--format_json-pretty: |
      {
          "status": "HEALTH_WARN",
          "checks": {
              "MON_CLOCK_SKEW": {
                  "severity": "HEALTH_WARN",
                  "summary": {
                      "message": "clock skew detected on mon.juju-a79b06-11-lxd-0"
                  },
                  "muted": false
              }
          },
          "mutes": []
      }
  copy-from-original:
    - sos_commands/date/date
    - sos_commands/systemd/systemctl_list-units
    - sos_commands/systemd/systemctl_list-unit-files
raised-issues:
  CephMonWarning: >-
    Ceph health detail reports MON_CLOCK_SKEW: the clock of at least one
    monitor differs from the leader by more than mon_clock_drift_allowed,
    which may affect quorum. Please check that time synchronisation (chrony
    or ntpd) is working on all monitor hosts. See
    https://docs.ceph.com/en/latest/rados/operations/health-checks/#mon-clock-skew
