data-root:
  files:
    sos_commands/ceph_mon/json_output/ceph_status_--format_json-pretty: |
      {
          "fsid": "eccf3d48-859f-11ec-9de2-d72b3e8a3058",
          "health": {
              "status": "HEALTH_WARN"
          }
      }
    sos_commands/ceph_mon/json_output/ceph_health_detail_--format_json-pretty: |
      {
          "status": "HEALTH_WARN",
          "checks": {
              "OBJECT_UNFOUND": {
                  "severity": "HEALTH_WARN",
                  "summary": {
                      "message": "1/12345 objects unfound (0.008%)"
                  },
                  "muted": false
              }
          },
          "mutes": []
      }
  copy-from-original:
    - sos_commands/date/date
    - sos_commands/systemd/systemctl_list-units
    - sos_commands/systemd/systemctl_list-unit-files
raised-issues:
  CephOSDWarning: >-
    Ceph health detail reports OBJECT_UNFOUND: no copy of some objects can
    be found on the available OSDs, so I/O to them blocks. Please bring
    back any down OSDs that may hold the data (see 'ceph pg <pgid>
    list_unfound') before considering 'mark_unfound_lost'. See
    https://docs.ceph.com/en/latest/rados/operations/health-checks/#object-unfound
