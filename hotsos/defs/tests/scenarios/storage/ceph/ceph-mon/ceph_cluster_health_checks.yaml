target-name: ceph_cluster_health.yaml
data-root:
  files:
    sos_commands/ceph_mon/json_output/ceph_status_--format_json-pretty: |
      {
          "fsid": "eccf3d48-859f-11ec-9de2-d72b3e8a3058",
          "health": {
              "status": "HEALTH_WARN"
          }
      }
    sos_commands/ceph_mon/json_output/ceph_health_detail_--format_json-pretty: |
      {
          "status": "HEALTH_WARN",
          "checks": {
              "MON_CLOCK_SKEW": {
                  "severity": "HEALTH_WARN",
                  "summary": {
                      "message": "clock skew detected on mon.juju-04f1e3-1-lxd-1",
                      "count": 1
                  },
                  "muted": false
              },
              "MON_MSGR2_NOT_ENABLED": {
                  "severity": "HEALTH_WARN",
                  "summary": {
                      "message": "1 monitors have not enabled msgr2",
                      "count": 1
                  },
                  "muted": true
              },
              "POOL_APP_NOT_ENABLED": {
                  "severity": "HEALTH_WARN",
                  "summary": {
                      "message": "1 pool(s) do not have an application enabled",
                      "count": 1
                  },
                  "muted": false
              }
          },
          "mutes": [
              {
                  "code": "MON_MSGR2_NOT_ENABLED",
                  "sticky": false,
                  "summary": "1 monitors have not enabled msgr2",
                  "count": 1
              }
          ]
      }
  copy-from-original:
    - sos_commands/date/date
    - sos_commands/systemd/systemctl_list-units
    - sos_commands/systemd/systemctl_list-unit-files
raised-issues:
  CephWarning: >-
    Ceph cluster is in 'HEALTH_WARN' state with unmuted health check(s)
    MON_CLOCK_SKEW, POOL_APP_NOT_ENABLED. Please check 'ceph health detail'
    for details.
