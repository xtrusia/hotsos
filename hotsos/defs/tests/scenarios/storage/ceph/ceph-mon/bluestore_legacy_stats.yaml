raised-bugs:
  https://tracker.ceph.com/issues/53062: >-
    Ceph health detail reports BLUESTORE_LEGACY_STATFS,
    BLUESTORE_NO_PER_PG_OMAP, BLUESTORE_NO_PER_POOL_OMAP for osd.0, osd.2,
    osd.10 (a legacy BlueStore stats or omap format, for which Ceph
    suggests a store repair) and 'ceph versions' shows running OSD
    version(s) 16.2.6. Ceph warns that on Pacific 16.2.6 and earlier the
    omap format conversion done by 'ceph-bluestore-tool repair' or
    'quick-fix', or by an OSD started with
    bluestore_fsck_quick_fix_on_mount = true, can corrupt omap data. 'ceph
    versions' does not say which OSDs run which version, and OSDs created
    on Octopus may not be listed above. Please do not run repair or
    quick-fix on any OSD that runs one of those versions, keep
    bluestore_fsck_quick_fix_on_mount false until all OSDs run 16.2.7 or
    later, and then convert the OSDs as described in
    https://docs.ceph.com/en/latest/rados/operations/health-checks/#bluestore-no-per-pg-omap.
