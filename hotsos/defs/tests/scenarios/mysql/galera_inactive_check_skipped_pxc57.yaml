target-name: galera_inactive_check_skipped.yaml
data-root:
  files:
    sos_commands/dpkg/dpkg_-l: |
      ii  percona-xtradb-cluster-server-5.7 5.7.28-31.41-2 amd64 Percona XtraDB Cluster database server binaries
    var/log/mysql/error.log: |
      2022-02-10T10:28:35.123456Z 0 [Warning] WSREP: last inactive check more than PT1.5S (3*evs.inactive_check_period) ago (PT6.50082S), skipping check
      2022-02-10T10:31:35.123456Z 0 [Warning] WSREP: last inactive check more than PT1.5S (3*evs.inactive_check_period) ago (PT2.2S), skipping check
  copy-from-original:
    - sos_commands/date/date
    - sos_commands/systemd/systemctl_list-units
    - sos_commands/systemd/systemctl_list-unit-files
raised-issues:
  MySQLWarning: >-
    The MySQL error log contains 1 Galera 'last inactive check more than
    ... ago, skipping check' warning(s) from the last 24 hours with gaps
    of PT6.50082S, so Galera group communication on this node stalled
    for at least 5 seconds. Please check CPU steal, swap and disk
    latency on this host around those times.
