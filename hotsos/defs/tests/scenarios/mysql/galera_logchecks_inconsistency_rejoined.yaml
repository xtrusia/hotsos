target-name: galera_logchecks.yaml
data-root:
  files:
    # The node rejoined, which after an inconsistency needs a full SST. It is
    # still reported because the cause can come back.
    sos_commands/dpkg/dpkg_-l: |
      ii  percona-xtradb-cluster-server     5.7.20-29.24-0ubuntu2.1 all          Percona XtraDB Cluster database server
      ii  percona-xtradb-cluster-server-5.7 5.7.20-29.24-0ubuntu2.1 amd64        Percona XtraDB Cluster database server binaries
    var/log/mysql/error.log: |
      2022-02-09T20:15:01.123510Z 2 [ERROR] WSREP: Node consistency compromized, aborting...
      2022-02-09T20:45:01.123456Z 0 [Note] WSREP: Shifting JOINED -> SYNCED (TO: 2411)
      2022-02-09T20:45:01.123500Z 2 [Note] WSREP: Synchronized with group, ready for connections
  copy-from-original:
    - sos_commands/date/date
raised-issues:
  MySQLWarning: >-
    This Percona XtraDB Cluster node logged 1 Galera inconsistency error(s)
    on 2022-02-09, so it failed to apply a write-set and aborted or left the
    cluster. Please check the 'Failed to apply' errors logged just before
    them and please rebuild the node with a full SST if it has not rejoined.
