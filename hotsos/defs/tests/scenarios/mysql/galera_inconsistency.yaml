data-root:
  files:
    sos_commands/dpkg/dpkg_-l: |
      ii percona-xtradb-cluster-server 8.0.32-24-1.focal all
    var/log/mysql/error.log: |
      2022-02-10T10:28:35.123456Z 0 [ERROR] [MY-000000] [Galera] Inconsistency detected: Inconsistent by consensus on 5b1e3f4a-1111-2222-3333-444455556666:12345
      2022-02-10 10:30:35 0 [ERROR] WSREP: Inconsistency detected: Inconsistent by consensus on 5b1e3f4a-1111-2222-3333-444455556666:12346
      2022-02-10  9:30:35 0 [ERROR] WSREP: Inconsistency detected: Inconsistent by consensus on 5b1e3f4a-1111-2222-3333-444455556666:12347
  copy-from-original:
    - sos_commands/date/date
    - sos_commands/systemd/systemctl_list-units
    - sos_commands/systemd/systemctl_list-unit-files
raised-issues:
  MySQLWarning: >-
    The MySQL error log contains 3 Galera 'Inconsistency detected'
    message(s) from the last 24 hours, so this node may have left the
    cluster with diverged data. Please check the current wsrep state of
    the node and re-join it with a full SST if it is still out of the
    cluster.
