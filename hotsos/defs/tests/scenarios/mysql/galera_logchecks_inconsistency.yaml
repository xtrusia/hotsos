target-name: galera_logchecks.yaml
data-root:
  files:
    # PXC 5.7 and 8.0 formats.
    sos_commands/dpkg/dpkg_-l: |
      ii  percona-xtradb-cluster-server     5.7.20-29.24-0ubuntu2.1 all          Percona XtraDB Cluster database server
      ii  percona-xtradb-cluster-server-5.7 5.7.20-29.24-0ubuntu2.1 amd64        Percona XtraDB Cluster database server binaries
    var/log/mysql/error.log: |
      2022-02-09T20:15:01.123456Z 2 [ERROR] Slave SQL: Could not execute Write_rows event on table test.t1; Duplicate entry '1' for key 'PRIMARY', Error_code: 1062; handler error HA_ERR_FOUND_DUPP_KEY; the event's master log FIRST, end_log_pos 140, Error_code: 1062
      2022-02-09T20:15:01.123500Z 2 [ERROR] WSREP: Failed to apply trx 2410 4 times
      2022-02-09T20:15:01.123510Z 2 [ERROR] WSREP: Node consistency compromized, aborting...
      2022-02-10T06:12:44.101200Z 14 [ERROR] [MY-000000] [Galera] Node consistency compromized, leaving cluster...
      2022-02-10T08:48:13.621690Z 11 [ERROR] [MY-000000] [Galera] Inconsistency detected: Inconsistent by consensus on 8a4e6b2c-8a1f-11ec-a0c4-1e2f3a4b5c6d:2411
  copy-from-original:
    - sos_commands/date/date
raised-issues:
  MySQLWarning: >-
    This Percona XtraDB Cluster node logged 3 Galera inconsistency error(s)
    on 2022-02-09, 2022-02-10, so it failed to apply a write-set and aborted
    or left the cluster. Please check the 'Failed to apply' errors logged
    just before them and please rebuild the node with a full SST if it has
    not rejoined.
