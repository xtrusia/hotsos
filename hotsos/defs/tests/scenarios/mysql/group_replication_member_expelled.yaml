raised-issues:
  MySQLWarning: >-
    The MySQL error log has 'Member was expelled from the group due to
    network failures' (MY-011505) errors on 2022-02-09, 2022-02-10. Group
    Replication logs this on a member that the other members expelled
    because they could not reach it for the 5 second detection period plus
    group_replication_member_expel_timeout; the member then goes to the
    ERROR state and leaves the group. What happens to it next depends on
    group_replication_exit_state_action (for example read only, offline mode
    or server abort), and it may rejoin by itself if auto-rejoin is enabled
    (group_replication_autorejoin_tries). Please check the cluster status
    (for example with the cluster-status action of the mysql-innodb-cluster
    charm or performance_schema.replication_group_members), the network
    between the cluster members around those dates and, on charmed
    deployments, the expel-timeout option (LP#1882205).
