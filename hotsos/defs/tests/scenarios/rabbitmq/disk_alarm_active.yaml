target-name: disk_alarm.yaml
data-root:
  files:
    # The report shows the alarm is still set.
    var/log/rabbitmq/rabbit@juju-04f1e3-1-lxd-5.log: |
      2022-02-10 08:48:13.621600+00:00 [info] <0.218.0> Free disk space is insufficient. Free bytes: 41943040. Limit: 50000000
      2022-02-10 08:48:13.621690+00:00 [warning] <0.218.0> disk resource limit alarm set on node 'rabbit@juju-04f1e3-1-lxd-6'.
    sos_commands/rabbitmq/rabbitmqctl_report: |
      Status of node rabbit@juju-04f1e3-1-lxd-5 ...

      Alarms

      (none)

      Memory

      Calculation strategy: rss

      Cluster status of node rabbit@juju-04f1e3-1-lxd-5 ...

      Alarms

      Free disk space alarm on node rabbit@juju-04f1e3-1-lxd-6

      Network Partitions

      (none)

  copy-from-original:
    - sos_commands/date/date
raised-issues:
  RabbitMQWarning: >-
    rabbitmqctl report showed a free disk space alarm on node(s)
    rabbit@juju-04f1e3-1-lxd-6 when it was collected, so publishers on all
    nodes of the cluster were blocked. Please free space on the filesystem
    holding the RabbitMQ data directory on those nodes.
