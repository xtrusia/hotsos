raised-issues:
  RabbitMQWarning: >-
    RabbitMQ logged a free disk space alarm on node(s)
    rabbit@juju-04f1e3-1-lxd-5, rabbit@juju-04f1e3-1-lxd-6 on 2022-02-09,
    2022-02-10, which blocks publishers on all nodes of the cluster while
    set. Please check with 'rabbitmq-diagnostics alarms' whether it is
    still set and please free space on the filesystem holding the RabbitMQ
    data directory.
