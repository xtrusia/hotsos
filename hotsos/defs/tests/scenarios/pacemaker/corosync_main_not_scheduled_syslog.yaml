target-name: corosync_main_not_scheduled.yaml
data-root:
  files:
    # syslog only (traditional timestamp).
    var/log/syslog: |
      Feb 10 08:48:13 juju-04f1e3-1-lxd-5 corosync[1234]:   [MAIN  ] Corosync main process was not scheduled for 2652.4536 ms (threshold is 800.0000 ms). Consider token timeout increase.
  copy-from-original:
    - sos_commands/date/date
raised-issues:
  PacemakerWarning: >-
    corosync logged 1 'Corosync main process was not scheduled' warning(s)
    in syslog on Feb 10, so its main process was not scheduled for more
    than 800.0000 ms (80% of the token timeout) and it may have handled
    totem messages late, which can lead to a membership change or a
    resource failover. Please check CPU load, steal time and memory
    pressure on this node and its hypervisor at the times of those
    warnings, and please increase the corosync token timeout if such pauses
    are expected.
