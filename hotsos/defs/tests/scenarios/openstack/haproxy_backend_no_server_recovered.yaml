raised-issues:
  OpenstackWarning: >-
    haproxy logged 'has no server available!' 20 times within one hour on
    Feb 10 (backend(s): nova-api-os-compute_10.5.0.10,
    nova-placement-api_10.5.0.10), so requests to those backends may have
    failed then. A restart of all API units also logs one event per backend
    (twice on charmed deployments). Please check the preceding 'Server
    <backend>/<server> is DOWN' lines and whether those API services are
    running and healthy.
