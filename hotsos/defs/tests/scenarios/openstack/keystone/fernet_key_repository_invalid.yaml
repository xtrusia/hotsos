raised-issues:
  OpenstackWarning: >-
    Keystone logged 2 time(s) on 2022-02-10 that its [fernet_tokens]
    key_repository (/etc/keystone/fernet-keys/) does not exist or is not
    accessible, so token issue and validation may have failed then. Please
    check that the directory exists, is accessible to the keystone user
    (writable too where keys are rotated) and holds the same keys as the
    other keystone units.
