target-name: fernet_key_repository_invalid.yaml
data-root:
  files:
    sos_commands/dpkg/dpkg_-l: |
      ii  keystone                             2:21.0.0-0ubuntu1~cloud0                             all          OpenStack identity service - Django web application
      ii  nova-common                          3:25.2.1-0ubuntu2.7~cloud0                           all          OpenStack Compute - common files
      ii  neutron-common                       2:20.3.0-0ubuntu1~cloud0                             all          Neutron is a virtual network service for Openstack - common
      ii  cinder-common                        2:20.3.0-0ubuntu1~cloud0                             all          Cinder storage service - common files
    # The repository was missing once and the error did not repeat (it is
    # checked on every key load, so it repeats while the problem lasts).
    # It is still reported with its date.
    var/log/keystone/keystone.log: |
      2022-02-10 10:28:35.123 1234 ERROR keystone.common.fernet_utils [-] Either [fernet_tokens] key_repository does not exist or Keystone does not have sufficient permission to access it: /etc/keystone/fernet-keys/
  copy-from-original:
    - sos_commands/date/date
raised-issues:
  OpenstackWarning: >-
    Keystone logged 1 time(s) on 2022-02-10 that its [fernet_tokens]
    key_repository (/etc/keystone/fernet-keys/) does not exist or is not
    accessible, so token issue and validation may have failed then. Please
    check that the directory exists, is accessible to the keystone user
    (writable too where keys are rotated) and holds the same keys as the
    other keystone units.
