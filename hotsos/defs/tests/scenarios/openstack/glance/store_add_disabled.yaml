raised-issues:
  OpenstackWarning: >-
    glance-api.log has 'Failed to configure store correctly ... Disabling
    add method' warnings for the store(s) filesystem, rbd on 2022-02-09,
    2022-02-10. glance_store logs this when configuring a store for
    writing fails with a configuration error, and removes the write
    capability of that store instance, so new images cannot be uploaded or
    imported to it until the store is configured again, for example when
    glance-api restarts. Please read the reason in the matching lines (for
    example a filesystem_store_datadir that cannot be created or written,
    a missing client library, or missing or wrong store options), fix it,
    restart glance-api and check that image uploads to that store work. A
    warning for a store that is configured but not used for uploads can be
    ignored.
