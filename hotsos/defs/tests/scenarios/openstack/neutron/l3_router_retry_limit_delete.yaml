raised-issues:
  OpenstackWarning: >-
    neutron-l3-agent gave up on update(s) for router(s)
    d4e5f6a7-b8c9-4d0e-8f1a-2b3c4d5e6f70 on 2022-02-10 ('Hit retry limit
    with router update'), so those routers may be out of date or missing on
    this host, or left behind after a failed delete, until another update
    or a full sync. Please check the 'Failed to process compatible router',
    'Failed to fetch router information' or 'Error while deleting router'
    errors logged before it, please check on this host whether those
    routers match their current state (for a router that still exists here
    its qrouter namespace and interfaces against 'openstack port list
    --router <router>', for a deleted or moved router that its qrouter
    namespace is gone), and if they do not, please restart neutron-l3-agent
    once the cause is fixed to force a full sync.
