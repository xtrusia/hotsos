raised-issues:
  OpenstackWarning: >-
    The neutron DHCP agent on this host logged 'Unable to sync network state.'
    10 times within 24 hours, so DHCP/dnsmasq config may be out of date for
    some networks. Please check for a later 'Synchronizing state complete' line
    and, if there is none, the traceback, RPC/messaging connectivity and
    neutron-server health.
