raised-issues:
  OpenstackWarning: >-
    neutron-server logged 21 failed binding attempt(s) ('Failed to bind
    port ... using segments') on 2022-02-10 for host(s) compute-1,
    compute-2.maas, and port(s) 2d0f5c7e-9a1b-4c3d-8e5f-6a7b8c9d0e1f,
    7f3e1d2c-4b5a-4968-8776-5a4b3c2d1e0f reached the 10th and last binding
    attempt ('Attempt 10 to bind port'). ML2 leaves a port with
    binding:vif_type binding_failed when all 10 attempts fail, so those
    ports may have been left binding_failed and instances using them may
    have failed to boot or move. Please check that the L2 agent or
    ovn-controller on those hosts is up in 'openstack network agent list'
    and has a bridge or physical network mapping for flat or VLAN segments
    in the error (VXLAN and Geneve segments need a tunnel type instead),
    and please check with 'openstack port show <port> -c binding_vif_type
    -c binding_host_id' whether those ports are still binding_failed.
