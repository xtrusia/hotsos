raised-issues:
  OpenstackWarning: >-
    neutron-l3-agent gave up on update(s) for router(s)
    b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e on 2022-02-10 ('Hit retry limit
    with router update'), so those routers may be out of date or missing on
    this host until another update or a full sync. Please check the 'Failed
    to process compatible router' or 'Failed to fetch router information'
    errors logged before it, please check on this host whether those
    routers are in place and up to date (for example their qrouter
    namespace and its interfaces against 'openstack port list --router
    <router>'), and if they are not, please restart neutron-l3-agent once
    the cause is fixed to force a full sync.
