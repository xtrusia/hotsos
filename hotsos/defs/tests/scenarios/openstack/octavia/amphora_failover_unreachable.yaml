data-root:
  files:
    # v2: an automatic amphora failover in the health manager and a load
    # balancer failover in the worker, both failing with TimeOutException.
    var/log/octavia/octavia-health-manager.log: |
      2022-02-10 09:12:44.731 1288 ERROR octavia.controller.worker.v2.controller_worker [-] Amphora 3e4f5a6b-7c8d-4e9f-8a0b-1c2d3e4f5a6b failover exception: contacting the amphora timed out: octavia.amphorae.driver_exceptions.exceptions.TimeOutException: contacting the amphora timed out
    var/log/octavia/octavia-worker.log: |
      2022-02-10 10:45:12.456 1534 ERROR octavia.controller.worker.v2.controller_worker [-] LB 7e6f5a4b-3c2d-4e1f-9a8b-7c6d5e4f3a2b failover exception: contacting the amphora timed out: octavia.amphorae.driver_exceptions.exceptions.TimeOutException: contacting the amphora timed out
  copy-from-original:
    - sos_commands/date/date
    - sos_commands/dpkg/dpkg_-l
raised-issues:
  OpenstackError: >-
    Octavia logged 2 failover failure(s) on 2022-02-10 for Amphora
    3e4f5a6b-7c8d-4e9f-8a0b-1c2d3e4f5a6b, LB
    7e6f5a4b-3c2d-4e1f-9a8b-7c6d5e4f3a2b because requests to an amphora
    agent kept failing until the connection retries ran out ('contacting
    the amphora timed out': the controller could not connect to the agent,
    the agent did not answer in time, or the agent or the amphora network
    interface was not ready), and it set them to ERROR. Please find which
    amphora did not answer from the 'Connection retries ... exhausted'
    error and 'Could not connect to instance' warnings before each failure
    (the address is in the reason when there is one), please check that its
    agent answers from the controller over the lb-mgmt-net on its port
    (9443 by default) and that its network ports were plugged, and once
    that works please fail over the load balancers that are still in ERROR
    (for an amphora, 'openstack loadbalancer amphora show <id>' shows its
    load balancer).
