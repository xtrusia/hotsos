target-name: amphora_failover_unreachable.yaml
data-root:
  files:
    # A later manual failover of the load balancer succeeded. The failure
    # is still reported and the message asks to fail over the load
    # balancers that are still in ERROR.
    var/log/octavia/octavia-worker.log: |
      2022-02-10 10:45:12.456 1534 ERROR octavia.controller.worker.v2.controller_worker [-] LB 7e6f5a4b-3c2d-4e1f-9a8b-7c6d5e4f3a2b failover exception: contacting the amphora timed out: octavia.amphorae.driver_exceptions.exceptions.TimeOutException: contacting the amphora timed out
      2022-02-10 11:20:03.882 1534 INFO octavia.controller.worker.v2.controller_worker [-] Failover of load balancer 7e6f5a4b-3c2d-4e1f-9a8b-7c6d5e4f3a2b completed successfully.
  copy-from-original:
    - sos_commands/date/date
    - sos_commands/dpkg/dpkg_-l
raised-issues:
  OpenstackError: >-
    Octavia logged 1 failover failure(s) on 2022-02-10 for LB
    7e6f5a4b-3c2d-4e1f-9a8b-7c6d5e4f3a2b because the controller could not
    reach an amphora, and it set them to ERROR. Please check that new
    amphorae boot and are reachable from the controller over the
    lb-mgmt-net on the amphora agent port (9443 by default), and once that
    works please fail over the load balancers that are still in ERROR (for
    an amphora, 'openstack loadbalancer amphora show <id>' shows its load
    balancer).
