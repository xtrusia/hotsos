target-name: network_allocation_failed.yaml
data-root:
  files:
    # Build timeouts without an aborted build (vif_plugging_is_fatal=False),
    # in the current and the 24.0.0 (no trailing period) formats. The live
    # migration timeout is not counted.
    var/log/nova/nova-compute.log: |
      2022-02-09 21:44:03.200 3110 WARNING nova.compute.manager [req-2c4e6a8c-0e2a-4c6e-8a0c-2e4a6c8e0a2c 5b2c0e6a8d4f4b1c9e7a3d5f1b9c7e3a 0c2e4a6c8e0a4c2e8a0c2e4a6c8e0a2c - default default] [instance: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f] Timeout waiting for ['network-vif-plugged-0f1e2d3c-4b5a-4697-8877-66554433225f'] for instance with vm_state building and task_state spawning. Event states are: network-vif-plugged-0f1e2d3c-4b5a-4697-8877-66554433225f: timed out after 300.00 seconds
      2022-02-10 10:02:17.900 3110 WARNING nova.virt.libvirt.driver [req-2c4e6a8c-0e2a-4c6e-8a0c-2e4a6c8e0a2c 5b2c0e6a8d4f4b1c9e7a3d5f1b9c7e3a 0c2e4a6c8e0a4c2e8a0c2e4a6c8e0a2c - default default] [instance: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d] Timeout waiting for [('network-vif-plugged', '5d4c3b2a-1908-4f7e-8d6c-5b4a39281706')] for instance with vm_state building and task_state spawning
      2022-02-10 11:30:00.500 3110 WARNING nova.compute.manager [req-2c4e6a8c-0e2a-4c6e-8a0c-2e4a6c8e0a2c 5b2c0e6a8d4f4b1c9e7a3d5f1b9c7e3a 0c2e4a6c8e0a4c2e8a0c2e4a6c8e0a2c - default default] [instance: 6c5b4a39-2817-4f6e-9d5c-4b3a29180f7e] Timeout waiting for ['network-vif-plugged-0f1e2d3c-4b5a-4697-8877-66554433227e'] for instance with vm_state active and task_state migrating. Event states are: network-vif-plugged-0f1e2d3c-4b5a-4697-8877-66554433227e: timed out after 300.00 seconds
  copy-from-original:
    - sos_commands/date/date
    - sos_commands/dpkg/dpkg_-l
raised-issues:
  OpenstackWarning: >-
    nova-compute logged 2 'Timeout waiting for [...network-vif-plugged...]'
    warning(s) while building instance(s)
    1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f,
    9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d on 2022-02-09, 2022-02-10 with no
    matching build abort in these logs, which can mean that
    vif_plugging_is_fatal is False (and those instances started before
    their network was ready) or that the abort is not in these logs. Please
    check vif_plugging_is_fatal in nova.conf, please check that the neutron
    L2 agent or ovn-controller on this host is running and processing ports
    and that neutron-server can send network-vif-plugged events to nova,
    and please check the network of those instances.
