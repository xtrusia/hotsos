raised-issues:
  OpenstackWarning: >-
    nova-compute logged 5 'Connection to libvirt failed' error(s) on
    2022-02-10, so it could not reach libvirtd at those times and may have
    disabled this compute service with an 'AUTO: ...' reason. Please check
    that libvirtd is running and that nova-compute can open its socket (the
    libvirt error follows 'Connection to libvirt failed:'), and please
    check with 'openstack compute service list' that nova-compute on this
    host is enabled and up again.
