raised-bugs:
  https://bugs.launchpad.net/bugs/2039803: >-
    Live migrations to this host failed the CPU pre-check with
    'Unacceptable CPU info: CPU doesn't have compatibility' on 2022-02-09,
    2022-02-10. Nova 3:27.1.0-0ubuntu1~cloud0 can reject hosts whose CPUs
    are compatible. Please compare the CPUs of both hosts and, if they are
    compatible, please set [workarounds] skip_cpu_compare_on_dest = True in
    nova.conf (charm option skip-cpu-compare-on-dest).
