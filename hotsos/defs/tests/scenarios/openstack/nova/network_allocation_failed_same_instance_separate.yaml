raised-issues:
  OpenstackWarning: >-
    nova-compute aborted 1 instance build(s) for
    3f2e1d0c-9b8a-4766-8554-4f3e2d1c0b9a on 2022-02-10 with 'Failed to
    allocate the network(s), not rescheduling' and logged 1 'Timeout
    waiting for [...network-vif-plugged...]' warning(s) for
    3f2e1d0c-9b8a-4766-8554-4f3e2d1c0b9a on 2022-02-10. With
    vif_plugging_is_fatal=True (the default) a vif plug timeout aborts a
    build this way, but the lines are not matched per build. Please check
    the lines before each abort ('Timeout waiting for
    [...network-vif-plugged...]' means a vif plug timeout and 'Neutron
    Reported failure on event' means neutron reported a failed vif plug),
    and please check that the neutron L2 agent or ovn-controller on this
    host is running and processing ports and that neutron-server can send
    network-vif-plugged events to nova.
