raised-issues:
  OpenstackWarning: >-
    nova-compute aborted 1 instance build(s) for
    3f2e1d0c-9b8a-4766-8554-4f3e2d1c0b9a on 2022-02-10 with 'Failed to
    allocate the network(s), not rescheduling' and logged 1 'Neutron
    Reported failure on event network-vif-plugged' error(s) for
    3f2e1d0c-9b8a-4766-8554-4f3e2d1c0b9a on 2022-02-10, so neutron reported
    that it could not plug the ports of those instances on this host.
    Please check the neutron L2 agent or ovn-controller log on this host
    for those ports, and please check the 'Failed to allocate network(s)'
    traceback before each abort.
