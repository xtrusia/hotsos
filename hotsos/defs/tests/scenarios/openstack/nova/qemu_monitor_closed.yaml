raised-issues:
  OpenstackWarning: >-
    nova-compute.log has libvirt 'internal error' messages (QEMU
    unexpectedly closed the monitor, process exited while connecting to
    monitor) on 2022-02-09, 2022-02-10. libvirt reports these when the
    QEMU process of a guest exited while it was starting, or during an
    incoming live migration. The QEMU output that follows the error, when
    present, usually names the cause, for example a device that could not
    be opened or memory that could not be allocated. Please read the full
    error line and the [instance: <uuid>] tag on it, then check
    /var/log/libvirt/qemu/<domain>.log (libvirt 9.4.0 and later add
    vm='<domain>' to the 'closed the monitor' error; otherwise the domain
    follows instance_name_template, instance-XXXXXXXX by default) and
    kern.log for OOM kills or segfaults of qemu. For a 'Live Migration
    failure' line the QEMU process that exited ran on the destination
    host, so please check the logs there.
