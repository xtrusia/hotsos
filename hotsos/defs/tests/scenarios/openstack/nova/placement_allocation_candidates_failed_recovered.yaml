raised-issues:
  OpenstackWarning: >-
    nova-scheduler logged 3 'Failed to retrieve allocation candidates from
    placement API' error(s) on 2022-02-10, so placement answered those
    scheduling requests with an error and they may have failed with 'No
    valid host was found'. Please read the 'Got <status>' line after each
    error: for a 5xx status please check the placement API log and its
    database, for a 400 please check the resources and traits requested by
    the flavor, image or ports, and for a 406 please upgrade placement to
    the latest version.
