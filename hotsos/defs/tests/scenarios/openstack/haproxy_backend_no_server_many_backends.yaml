raised-issues:
  OpenstackWarning: >-
    haproxy logged 'has no server available!' 20 times within one hour on
    2022-02-10 (backend(s): aodh-api_10.5.0.10, barbican-api_10.5.0.10,
    cinder-api_10.5.0.10, glance-api_10.5.0.10, heat-api_10.5.0.10,
    keystone-public_10.5.0.10, neutron-api_10.5.0.10,
    nova-api-os-compute_10.5.0.10, nova-placement-api_10.5.0.10,
    octavia-api_10.5.0.10), so requests to those backends may have failed
    then. A restart of all API units also logs one event per backend (twice
    on charmed deployments). Please check the preceding 'Server
    <backend>/<server> is DOWN' lines and whether those API services are
    running and healthy.
